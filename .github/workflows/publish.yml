# Publishes the package to npm when a version's tag (v1.2.3) reaches GitHub. npm's trusted publishing
# trusts this workflow of this repository, so no token is kept anywhere, and the package carries a
# provenance statement saying where and from which commit it was built. The tag must match the package's
# version and the whole check must pass first; a preview version (with a hyphen) goes out under `next`.
# The `npm` environment can hold the job for the author's approval. Actions are pinned to the commit of
# their release tag.
name: Publish

on:
    push:
        tags: ['v*']

permissions: {}

jobs:
    publish:
        runs-on: windows-latest
        environment: npm
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  cache: npm
                  registry-url: https://registry.npmjs.org
            - name: The tag names the package's version
              shell: pwsh
              run: |
                  $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
                  if ("v$version" -ne $env:GITHUB_REF_NAME) {
                      Write-Error "The tag $env:GITHUB_REF_NAME does not name the version $version."
                      exit 1
                  }
            - run: npm ci
            - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\check.ps1
            # A version with a hyphen (1.0.0-rc.0) is a preview: it goes out as `next`, never as `latest`.
            - name: Publish
              shell: pwsh
              run: |
                  $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
                  $tag = if ($version.Contains('-')) { 'next' } else { 'latest' }
                  npm publish --provenance --access public --tag $tag
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
