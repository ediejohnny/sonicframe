# Runs the whole check (scripts/check.ps1: lint, types, copied code, tests, the build, its size and its web
# addresses) on every push and pull request. It runs on Windows, where the script runs as it does on the
# author's machine. Actions are pinned to the commit of their release tag.
name: Check

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 26
                  cache: npm
            - run: npm ci
            - run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\check.ps1
