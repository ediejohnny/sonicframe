<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Theme gallery · SonicFrame</title>
        <meta
            name="description"
            content="Every SonicFrame player theme in every palette, with the code for each."
        />
    </head>
    <body>
        <main class="content gallery-page">
            <section class="gallery-head" aria-labelledby="title">
                <h1 id="title">Themes</h1>
                <p class="lede">
                    Twenty-four themes, eight at a time, each in all eight
                    palettes. Every player here plays the same sound, so they
                    all move together. Touch one to pick it; the bar at the
                    bottom copies its code.
                </p>

                <div class="toolbar">
                    <div class="field">
                        <span id="sets-label">Themes</span>
                        <div
                            id="sets"
                            class="tabs"
                            role="group"
                            aria-labelledby="sets-label"
                        ></div>
                    </div>
                    <label class="field">
                        Drawing
                        <select id="wave"></select>
                    </label>
                    <label class="field">
                        Font
                        <select id="font"></select>
                    </label>
                    <label class="check">
                        <input id="volume" type="checkbox" />
                        Volume
                    </label>
                    <button id="pick" class="button" type="button">
                        Use your own sound
                    </button>
                    <input id="file" type="file" accept="audio/*" hidden />
                </div>
                <p id="source" class="note" aria-live="polite">
                    Loading the sound…
                </p>
            </section>

            <div id="gallery" class="gallery"></div>

            <div class="pickbar" id="pickbar" hidden>
                <p id="pickbar-name"></p>
                <button id="copy-js" class="button small" type="button">
                    Copy JavaScript
                </button>
                <button id="copy-tag" class="button small" type="button">
                    Copy HTML tag
                </button>
                <a class="button small" href="#picked-title">See the code</a>
            </div>

            <section
                class="picked"
                id="picked"
                aria-labelledby="picked-title"
                hidden
            >
                <h2 id="picked-title">The player you picked</h2>
                <p id="picked-name" class="note"></p>
                <div class="snippets">
                    <div class="snippet">
                        <h3>In JavaScript</h3>
                        <div class="code">
                            <pre><code id="picked-js"></code></pre>
                            <button class="button small" type="button">
                                Copy
                            </button>
                        </div>
                    </div>
                    <div class="snippet">
                        <h3>As an HTML tag</h3>
                        <div class="code">
                            <pre><code id="picked-tag"></code></pre>
                            <button class="button small" type="button">
                                Copy
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <script type="module" src="./themes.ts"></script>
    </body>
</html>
